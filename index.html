
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT 2.5 - GOOGLE SIGN IN</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta name="google-signin-client_id" content="25659079718-vquo16aeqn90oc4vsfufm41u9dlfmstg.apps.googleusercontent.com">

</head>
<body>

    <h1>PT 2.5 - GOOGLE SIGN IN</h1>
    <br>
    <p>pagina preparada per afegir OAuth 2</p>

    <div
        id="g_id_onload"
        data-client_id="25659079718-vquo16aeqn90oc4vsfufm41u9dlfmstg.apps.googleusercontent.com"
        data-callback="onSignIn">
    </div>

    <div
        class="g_id_signin"
        data-type="standard">
    </div>

    <button
        id="boto-sortir"
        style="display:none;"
        onclick="signOut()">
        Desconnectar
    </button>


<script>
    function onSignIn(response) {
        var id_token = response.credential;
        console.log('ID Token: ' + id_token);

        document.getElementById('boto-sortir').style.display = 'block';
        document.querySelector('.g_id_signin').style.display = 'none';
    }

    function signOut() {
        document.getElementById('boto-sortir').style.display = 'none';
        document.querySelector('.g_id_signin').style.display = 'block';
    }
</script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #ffffff;
        background:
            radial-gradient(circle at top left, #173b65, transparent 45%),
            radial-gradient(circle at bottom right, #45216b, transparent 45%),
            #080d19;
        text-align: center;
        padding: 30px;
    }

    h1 {
        font-size: 42px;
        letter-spacing: 2px;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #00d4ff, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    p {
        color: #aab8d0;
        font-size: 17px;
        margin-bottom: 35px;
    }

    h2 {
        color: #00e5ff;
        font-size: 25px;
        padding: 20px 30px;
        margin: 25px;
        border: 1px solid #00d4ff;
        border-radius: 15px;
        background: rgba(0, 212, 255, 0.08);
        box-shadow: 0 0 25px rgba(0, 212, 255, 0.2);
    }

    #boto-sortir {
        margin-top: 30px;
        padding: 14px 35px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, #7c3aed, #2563eb);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    #boto-sortir:hover {
        transform: scale(1.08);
        box-shadow: 0 0 25px #6366f1;
    }

    .g_id_signin {
        margin-top: 20px;
        display: flex;
        justify-content: center;
    }
</style>
</body>
    


</html>
